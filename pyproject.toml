[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-auth"
version = "1.0.0"
description = "Continuous behavioural authentication for online banking: typing and mouse rhythm, bots, remote control and coaching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7",
       "scikit-learn>=1.4", "matplotlib>=3.8"]
evaluate = ["scikit-learn>=1.4", "matplotlib>=3.8"]  # evaluate and realdata commands

[project.scripts]
behavauth = "behavauth.__main__:main"

[tool.setuptools]
packages = ["behavauth"]

[tool.setuptools.package-data]
behavauth = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["behavauth"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905", "E731"]  # Depends() defaults are FastAPI's idiom; zip(strict=) and named lambdas are style
